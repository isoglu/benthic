// ── Bild ──
function frame(t) {

  ctx.clearRect(0, 0, W, H);
  if (st.clip) {
    // Der Hintergrund wird durchsichtig und gibt die Oberfläche der App frei, während das Symbol kleiner wird.
    const a = 1 - smooth((t - T.iconStart - .15) / .8);
    if (a > 0) {
      const g = ctx.createRadialGradient(W * .5, -H * .25, 0, W * .5, -H * .25, H * 1.35);
      g.addColorStop(0, `rgba(16,40,90,${a})`); g.addColorStop(1, `rgba(4,10,23,${a})`);

    }

    drawBase(lctx, 1, st, t, d);

    const g = lctx.createRadialGradient(st.ox, st.oy, 0, st.ox, st.oy, R + fe);
    g.addColorStop(0, "#000"); g.addColorStop(R / (R + fe), "#000"); g.addColorStop(1, "rgba(0,0,0,0)");

// ── Ablauf ──
const hud = document.getElementById("hud"), depthEl = document.getElementById("depth"), statusEl = document.getElementById("status");
const num = new Intl.NumberFormat(lang === "de" ? "de-DE" : "en-GB");
statusEl.textContent = lang === "de" ? "Benthic startet …" : "Starting Benthic…";
const SND = { ac: null, fx: null, perf: null };
let t = T.start, last = performance.now(), readyAt = null, skipWanted = false, finished = false, audioSeen = -1;

function restartSound(from) {
  if (!SND.ac || SND.ac.state !== "running") return;
  if (SND.perf) cancelPerf(SND.perf);
  SND.perf = perform(SND.ac, SND.fx, from + .04 * speed, speed);
}
layout();
if (wantSound) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;

    // Nur hörbar, solange das Fenster zu sehen ist (etwa nicht bei gesperrtem Bildschirm); Bild und Ton halten dann gemeinsam an.
    const go = () => { if (!finished && !SND.perf && SND.ac.state === "running" && !document.hidden) restartSound(t); };
    if (document.hidden) SND.ac.suspend(); else if (SND.ac.state === "running") go(); else SND.ac.resume().then(go, () => {});
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) SND.ac.suspend(); else if (!finished) SND.ac.resume().then(go, () => {});
    });
    setTimeout(() => post({ action: "log", message: `Intro (${version}): Ton ${SND.ac.state}` }), 400);
  } catch (e) { SND.ac = null; post({ action: "log", message: "Intro: kein Ton (" + e.message + ")" }); }
}

// Ende, ob gelandet oder übersprungen. tail: so lange klingt der Ton noch nach (die App wartet damit).

  finished = true;
  if (tail < 1 && SND.perf) { cancelPerf(SND.perf); SND.perf = null; }
  // Der Nachhall klingt aus und ist zum Ende von tail still, bevor die App die Seite entfernt.
  else if (SND.perf) { const g = SND.fx.master.gain, at = SND.ac.currentTime; g.setValueAtTime(g.value, at + tail * .4); g.linearRampToValueAtTime(0, at + tail); }
  post({ action: "done", tail });
}
window.benthicIntro = {
  // Die Oberfläche ist geladen; rect ist das Zeichen in der Seitenleiste (oder null).
  ready(rect) {
    if (readyAt !== null || finished) return;
    readyAt = t; target = rect || null; layout();
    if (skipWanted) { finish(.4); return; }
    setIgnite(Math.max(T.hold0, t + .85));
    if (SND.perf) restartSound(t);
  }
};
function skip() {
  if (finished) return;
  if (readyAt !== null) { finish(.4); return; }
  skipWanted = true;
  if (t < T.hold0 - .3) { t = T.hold0 - .3; if (SND.perf) restartSound(t); }
}
// Wie auf der Website läuft das Intro durch: Klicks beenden es nicht, nur Escape.
addEventListener("keydown", (e) => { if (e.key === "Escape") skip(); });
addEventListener("resize", () => { layout(); frame(t); });

function tick(now) {
  if (finished) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // Mit Ton führt die Uhr des Tons, damit Bild und Klang nicht auseinanderlaufen. Steht sie (kein
  // Ausgabegerät, gesperrter Bildschirm), läuft das Bild mit seiner eigenen Uhr weiter.
  const at = SND.perf ? SND.ac.currentTime : -1;
  if (at > audioSeen + 1e-4) { audioSeen = at; t = Math.max(t, SND.perf.t0 + (at - SND.perf.start - (SND.ac.outputLatency || 0)) * SND.perf.s); }
  else t += dt * speed;
  if (t >= T.end) { t = T.end; frame(t); finish(SND.perf ? 2.6 : 0); return; }
  frame(t);
  requestAnimationFrame(tick);
}
frame(t);
requestAnimationFrame(tick);
post({ action: "loaded" });
})();
</script>
</body>
</html>
